<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>Find</title>
  <style>
    html, body {
      margin: 0;
      height: 100%;
      overflow: hidden;
      background: transparent;
    }
    .bar {
      display: flex;
      align-items: center;
      width: 100%;
      height: 100%;
      padding: 0 6px 0 12px;
      box-sizing: border-box;
      border: 1px solid rgba(255, 255, 255, .16);
      border-radius: 10px;
      background: rgba(27, 27, 30, .96);
      color: #f4f4f5;
      font: 13px/1 -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    }
    input {
      flex: 1 1 auto;
      min-width: 0;
      margin: 0;
      padding: 0;
      border: 0;
      outline: none;
      background: transparent;
      color: inherit;
      font: inherit;
      letter-spacing: .01em;
    }
    input::placeholder { color: rgba(244, 244, 245, .45); }
    .count {
      flex: 0 0 auto;
      min-width: 42px;
      margin: 0 4px 0 10px;
      color: rgba(244, 244, 245, .55);
      font: 11px/1 ui-monospace, SFMono-Regular, Menlo, monospace;
      font-variant-numeric: tabular-nums;
      text-align: right;
      white-space: nowrap;
    }
    .count[data-empty="1"] { color: #ff9f9a; }
    button {
      all: unset;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 26px;
      height: 26px;
      border-radius: 7px;
      color: rgba(244, 244, 245, .7);
      cursor: default;
    }
    button:hover { background: rgba(255, 255, 255, .12); color: #fff; }
    button:active { background: rgba(255, 255, 255, .18); }
    button:focus-visible { box-shadow: 0 0 0 2px rgba(255, 255, 255, .35); }
    svg { display: block; width: 14px; height: 14px; }
  </style>
</head>
<body>
  <div class="bar" role="search">
    <input id="query" type="text" autocomplete="off" spellcheck="false">
    <span id="count" class="count" aria-live="polite"></span>
    <button id="prev" type="button">
      <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 10l4-4 4 4"/></svg>
    </button>
    <button id="next" type="button">
      <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 6l4 4 4-4"/></svg>
    </button>
    <button id="close" type="button">
      <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 4l8 8M12 4l-8 8"/></svg>
    </button>
  </div>
  <script>
    const TEXT = {
      zh: { placeholder: '在页面中查找', previous: '上一个', next: '下一个', close: '关闭', empty: '无结果' },
      en: { placeholder: 'Find in page', previous: 'Previous', next: 'Next', close: 'Close', empty: 'No results' },
    }

    const query = document.getElementById('query')
    const count = document.getElementById('count')
    const prev = document.getElementById('prev')
    const next = document.getElementById('next')
    const close = document.getElementById('close')

    let lang = 'zh'
    let timer = null
    let composing = false
    let lastSearched = ''

    function applyText() {
      const strings = TEXT[lang]
      document.documentElement.lang = lang === 'en' ? 'en' : 'zh-CN'
      query.setAttribute('placeholder', strings.placeholder)
      query.setAttribute('aria-label', strings.placeholder)
      prev.setAttribute('aria-label', strings.previous)
      prev.title = strings.previous
      next.setAttribute('aria-label', strings.next)
      next.title = strings.next
      close.setAttribute('aria-label', strings.close)
      close.title = strings.close
    }

    function schedule(delay = 110) {
      clearTimeout(timer)
      timer = setTimeout(runSearch, delay)
    }

    function runSearch() {
      const text = query.value
      if (!text) {
        lastSearched = ''
        count.textContent = ''
        count.removeAttribute('data-empty')
        void window.dshFind.search({ text: '' })
        return
      }
      lastSearched = text
      void window.dshFind.search({ text, findNext: false, forward: true })
    }

    /** Enter/arrows: continue an unchanged query, otherwise start a fresh search. */
    function step(forward) {
      const text = query.value
      if (!text) return
      clearTimeout(timer)
      const findNext = text === lastSearched
      lastSearched = text
      void window.dshFind.search({ text, findNext, forward })
    }

    query.addEventListener('input', () => {
      if (composing) return
      schedule()
    })
    query.addEventListener('compositionstart', () => { composing = true })
    query.addEventListener('compositionend', () => {
      composing = false
      schedule(0)
    })
    query.addEventListener('keydown', (event) => {
      if (event.isComposing) return
      if (event.key === 'Enter') {
        event.preventDefault()
        step(!event.shiftKey)
      }
    })

    // Keep the caret in the field while clicking the controls.
    for (const button of [prev, next, close]) {
      button.addEventListener('mousedown', (event) => event.preventDefault())
    }
    prev.addEventListener('click', () => step(false))
    next.addEventListener('click', () => step(true))
    close.addEventListener('click', () => { void window.dshFind.close() })

    window.addEventListener('keydown', (event) => {
      if (event.key !== 'Escape') return
      event.preventDefault()
      void window.dshFind.close()
    }, true)

    window.dshFind.onShow(({ lang: nextLang }) => {
      lang = nextLang === 'en' ? 'en' : 'zh'
      applyText()
      query.focus()
      query.select()
      if (query.value) schedule(0)
    })

    window.dshFind.onFocus(() => {
      query.focus()
      query.select()
    })

    window.dshFind.onResult((result) => {
      if (!query.value) {
        count.textContent = ''
        count.removeAttribute('data-empty')
        return
      }
      const matches = Number(result?.matches) || 0
      const active = Number(result?.active) || 0
      if (!matches) {
        // Intermediate updates can be empty; only the final one earns "No results".
        count.textContent = result?.final ? TEXT[lang].empty : ''
        if (result?.final) count.setAttribute('data-empty', '1')
        else count.removeAttribute('data-empty')
        return
      }
      count.removeAttribute('data-empty')
      count.textContent = `${active}/${matches}`
    })

    applyText()
    query.focus()
  </script>
</body>
</html>
