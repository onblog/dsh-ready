<!doctype html>
<html lang="zh-CN" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self'; script-src 'self'; img-src 'self' data:; media-src 'self'">
  <title>DSH 就位</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body data-status="not-installed">
  <div id="boot" class="boot" role="status" aria-live="polite">
    <span class="boot-spinner" aria-hidden="true"></span>
    <p class="boot-text" data-i18n="notice.bootLoading">正在读取本地状态…</p>
  </div>
  <div id="modal" class="modal" hidden>
    <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <h2 id="modalTitle" class="modal-title"></h2>
      <div id="modalBody" class="modal-body"></div>
      <div class="modal-actions">
        <button id="modalCancel" class="btn" type="button"></button>
        <button id="modalConfirm" class="btn primary" type="button"></button>
      </div>
    </div>
  </div>
  <div id="settings" class="sheet" hidden>
    <div class="sheet-card" role="dialog" aria-modal="true" aria-labelledby="settingsTitle" tabindex="-1">
      <button id="settingsClose" class="sheet-close" type="button" data-i18n-aria="sheet.close" aria-label="关闭">
        <svg viewBox="0 0 12 12" aria-hidden="true"><path d="M1 1l10 10M11 1L1 11" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
      </button>

      <div class="sheet-head">
        <img class="sheet-icon" src="assets/app-icon.png" alt="" width="52" height="52">
        <div class="sheet-title">
          <h2 id="settingsTitle">DSH 就位</h2>
          <span id="settingsVersion" class="sheet-version mono">v—</span>
        </div>
      </div>

      <div class="dev-line">
        <button id="devName" class="dev-item dev-name" type="button" data-i18n-aria="sheet.devName">
          <svg class="dev-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="12" cy="8" r="3.6"/>
            <path d="M4.6 20.4c0-3.6 3.3-5.6 7.4-5.6s7.4 2 7.4 5.6"/>
          </svg>
          <span>Martin</span>
        </button>
        <span class="dev-sep" aria-hidden="true">·</span>
        <button id="devEmail" class="dev-item" type="button" data-i18n-aria="sheet.devEmail">
          <svg class="dev-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <rect x="2.6" y="5" width="18.8" height="14" rx="2.6"/>
            <path d="m3.6 7.2 8.4 5.9 8.4-5.9"/>
          </svg>
          <span id="devEmailText"></span>
        </button>
        <span class="dev-sep" aria-hidden="true">·</span>
        <button id="devGithub" class="dev-item" type="button">
          <svg class="dev-ico" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2C6.48 2 2 6.58 2 12.26c0 4.5 2.87 8.32 6.84 9.67.5.1.68-.22.68-.49 0-.24-.01-.87-.01-1.7-2.78.62-3.37-1.37-3.37-1.37-.45-1.18-1.11-1.5-1.11-1.5-.91-.64.07-.62.07-.62 1 .07 1.53 1.06 1.53 1.06.89 1.56 2.34 1.11 2.91.85.09-.66.35-1.11.63-1.37-2.22-.26-4.56-1.14-4.56-5.07 0-1.12.39-2.03 1.03-2.75-.1-.26-.45-1.3.1-2.71 0 0 .84-.28 2.75 1.05a9.36 9.36 0 0 1 5 0c1.91-1.33 2.75-1.05 2.75-1.05.55 1.41.2 2.45.1 2.71.64.72 1.03 1.63 1.03 2.75 0 3.94-2.34 4.81-4.57 5.06.36.32.68.94.68 1.9 0 1.37-.01 2.47-.01 2.8 0 .27.18.6.69.49A10.02 10.02 0 0 0 22 12.26C22 6.58 17.52 2 12 2Z"/></svg>
          <span>GitHub</span>
        </button>
        <span class="dev-sep" aria-hidden="true">·</span>
        <button id="devSite" class="dev-item" type="button">
          <svg class="dev-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.5 2.6 3.8 5.6 3.8 9S14.5 18.4 12 21c-2.5-2.6-3.8-5.6-3.8-9S9.5 5.6 12 3Z"/></svg>
          <span data-i18n="sheet.site">官网</span>
        </button>
      </div>

      <div class="sheet-rows">
        <p class="group-title" data-i18n="sheet.groupGeneral">常规</p>

        <div class="row">
          <div class="row-label">
            <span data-i18n="sheet.autoLaunch">开机自启动</span>
            <span id="autoLaunchNote" class="row-note" hidden></span>
          </div>
          <button id="autoLaunch" class="switch" type="button" role="switch" aria-checked="false" disabled>
            <span class="switch-knob"></span>
          </button>
        </div>

        <div class="row">
          <div class="row-label">
            <span id="portLabel" data-i18n="sheet.port">DSH 端口</span>
            <span id="portNote" class="row-note">—</span>
          </div>
          <input id="portField" class="field narrow mono" type="text" inputmode="numeric" maxlength="5" aria-labelledby="portLabel">
        </div>

        <div class="row">
          <div class="row-label">
            <span data-i18n="sheet.openInBrowser">启动后自动打开浏览器</span>
          </div>
          <button id="openInBrowser" class="switch" type="button" role="switch" aria-checked="false">
            <span class="switch-knob"></span>
          </button>
        </div>

        <div class="row">
          <span class="row-label" id="themeLabelText" data-i18n="sheet.theme">主题</span>
          <div class="seg" id="themeSeg" role="radiogroup" aria-labelledby="themeLabelText">
            <button class="seg-item" type="button" role="radio" data-value="light" aria-checked="false" data-i18n="theme.light">浅色</button>
            <button class="seg-item" type="button" role="radio" data-value="dark" aria-checked="true" data-i18n="theme.dark">深色</button>
          </div>
        </div>

        <div class="row">
          <span class="row-label" id="langLabelText" data-i18n="sheet.lang">语言</span>
          <div class="seg" id="langSeg" role="radiogroup" aria-labelledby="langLabelText">
            <button class="seg-item" type="button" role="radio" data-value="zh" aria-checked="true">中文</button>
            <button class="seg-item" type="button" role="radio" data-value="en" aria-checked="false">English</button>
          </div>
        </div>

        <p class="group-title" data-i18n="sheet.groupNetwork">网络</p>

        <div class="row">
          <span class="row-label" id="registryLabel" data-i18n="sheet.npmRegistry">npm 源</span>
          <div class="seg" id="registrySeg" role="radiogroup" aria-labelledby="registryLabel">
            <button class="seg-item" type="button" role="radio" data-value="auto" aria-checked="true" data-i18n="sheet.registryAuto">自动</button>
            <button class="seg-item" type="button" role="radio" data-value="official" aria-checked="false" data-i18n="sheet.registryOfficial">官方</button>
            <button class="seg-item" type="button" role="radio" data-value="mirror" aria-checked="false" data-i18n="sheet.registryMirror">镜像</button>
          </div>
        </div>

        <div class="row stack">
          <div class="row-label">
            <label for="proxyField" data-i18n="sheet.proxy">HTTP(S) 代理</label>
            <span id="proxyNote" class="row-note" data-i18n="sheet.proxyHint">仅对 npm 与 DSH 子进程生效，留空表示不使用</span>
          </div>
          <input id="proxyField" class="field mono" type="text" spellcheck="false" placeholder="http://127.0.0.1:7890">
        </div>

        <div class="row stack">
          <div class="row-label">
            <label for="argsField" data-i18n="sheet.dshArgs">DSH 附加启动参数</label>
            <span id="argsNote" class="row-note" data-i18n="sheet.argsHint">空格分隔；端口由上面的设置统一管理</span>
          </div>
          <input id="argsField" class="field mono" type="text" spellcheck="false" placeholder="--host 0.0.0.0">
        </div>

        <p class="group-title" data-i18n="sheet.groupPrivacy">隐私与更新</p>

        <div class="row">
          <div class="row-label">
            <span data-i18n="sheet.telemetry">匿名启动上报</span>
            <span class="row-note" data-i18n="sheet.telemetryHint">只含随机设备 ID 与版本号</span>
          </div>
          <button id="telemetry" class="switch" type="button" role="switch" aria-checked="true">
            <span class="switch-knob"></span>
          </button>
        </div>

        <div class="row">
          <div class="row-label">
            <span data-i18n="sheet.autoUpdate">自动检查更新</span>
            <span class="row-note" data-i18n="sheet.autoUpdateHint">每天最多一次</span>
          </div>
          <button id="autoUpdateCheck" class="switch" type="button" role="switch" aria-checked="true">
            <span class="switch-knob"></span>
          </button>
        </div>

        <div class="row">
          <div class="row-label">
            <span data-i18n="sheet.update">检查更新</span>
            <span id="updateNote" class="row-note">—</span>
          </div>
          <button id="updateBtn" class="btn row-btn" type="button" data-i18n="update.check">检测更新</button>
        </div>
      </div>

      <div class="sheet-foot">
        <button id="sponsorBtn" class="sponsor" type="button">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true">
            <path d="M4 8h12v6a4 4 0 0 1-4 4H8a4 4 0 0 1-4-4V8Z" />
            <path d="M16 9h1.5a2.5 2.5 0 0 1 0 5H16" />
            <path d="M7 3.5c-.6.8-.6 1.7 0 2.5M11 3.5c-.6.8-.6 1.7 0 2.5" />
          </svg>
          <span data-i18n="sheet.sponsor">请我喝杯咖啡</span>
        </button>
      </div>
    </div>
  </div>
  <div class="app">
    <header class="bar">
      <div class="identity">
        <h1 data-i18n="app.title">DSH 就位</h1>
        <span class="name-en" data-i18n="app.subtitle">dsh-ready</span>
      </div>
      <div class="bar-actions">
        <button id="langBtn" class="icon-btn" type="button" data-i18n-aria="lang.aria" data-i18n-title="lang.aria" aria-label="切换语言" title="切换语言">
          <!-- 「文A」glyph pair: the universal translate mark, never a globe or a locale word. -->
          <svg class="ico-lang" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
            <path d="m12.87 15.07-2.54-2.51.03-.03A17.5 17.5 0 0 0 14.07 6H17V4h-7V2H8v2H1v1.99h11.17C11.5 7.92 10.44 9.75 9 11.35 8.07 10.32 7.3 9.19 6.69 8h-2c.73 1.63 1.73 3.17 2.98 4.56l-5.09 5.02L4 19l5-5 3.11 3.11zM18.5 10h-2L12 22h2l1.12-3h4.75L21 22h2zm-2.62 7 1.62-4.33L19.12 17z"/>
          </svg>
        </button>
        <button id="themeBtn" class="icon-btn" type="button" data-i18n-aria="theme.aria" data-i18n-title="theme.aria" aria-label="切换主题" title="切换主题">
          <svg class="ico-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" aria-hidden="true">
            <circle cx="12" cy="12" r="4"/>
            <path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>
          </svg>
          <svg class="ico-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M21 12.8A8.5 8.5 0 1 1 11.2 3a6.6 6.6 0 0 0 9.8 9.8Z"/>
          </svg>
        </button>
        <button id="settingsBtn" class="icon-btn" type="button" data-i18n-aria="sheet.aria" data-i18n-title="sheet.aria" aria-label="设置" title="设置">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="12" cy="12" r="3"/>
            <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.6 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.6a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1Z"/>
          </svg>
        </button>
        <button id="quitBtn" class="icon-btn" type="button" data-i18n-aria="quit.aria" data-i18n-title="quit.aria" aria-label="退出 DSH 就位" title="退出 DSH 就位">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" aria-hidden="true">
            <path d="M12 3v9"/>
            <path d="M6.4 6.4a8 8 0 1 0 11.2 0"/>
          </svg>
        </button>
      </div>
    </header>

    <section class="hero" aria-live="polite">
      <div id="petBox" class="whale" role="img" data-i18n-aria="pet.aria" aria-label="鲸鱼娘，点击互动">
        <img id="petImg" class="whale-img" src="assets/whale-girl.png" alt="">
        <video id="petA" class="pet-video" muted loop playsinline preload="auto"></video>
        <video id="petB" class="pet-video" muted loop playsinline preload="auto"></video>
        <span class="whale-halo"></span>
      </div>
      <div class="status-block">
        <div class="status-line">
          <span id="dot" class="dot"></span>
          <strong id="statusText">检查中</strong>
          <span id="versionTag" class="version-tag mono">v—</span>
        </div>
        <p id="hint" class="hint">正在读取本地状态…</p>
        <dl class="facts">
          <div class="fact">
            <dt data-i18n="fact.host">主机</dt>
            <dd id="addr" class="mono">—</dd>
          </div>
          <div class="fact">
            <dt data-i18n="fact.port">端口</dt>
            <dd class="port-cell">
              <!-- Read-only on purpose: the port lives in the settings sheet, one single source of truth. -->
              <span id="portValue" class="port-value mono" title="在设置中修改">3080</span>
            </dd>
          </div>
        </dl>
      </div>
    </section>

    <section id="flow" class="flow" hidden>
      <div class="flow-head">
        <span id="flowTitle">升级 DSH</span>
        <button id="flowBack" class="clear" type="button" data-i18n="flow.back">返回</button>
      </div>
      <p id="flowSummary" class="flow-summary">正在检查…</p>
      <p id="flowNote" class="flow-note" hidden></p>
      <section id="target" class="target">
        <div class="target-head">
          <label id="targetLabel" for="versionPicker">目标版本</label>
          <span id="latestTag" class="latest">最新 —</span>
        </div>
        <div class="combo">
          <button id="versionPicker" class="picker mono" type="button" aria-haspopup="listbox" aria-expanded="false">
            <span id="versionValue">加载中…</span>
            <svg class="chevron" viewBox="0 0 10 6" aria-hidden="true"><path d="M1 1l4 4 4-4" fill="none" stroke="currentColor" stroke-width="1.3"/></svg>
          </button>
          <ul id="versionList" class="version-list" role="listbox" hidden></ul>
        </div>
      </section>
      <div id="flowReport" class="flow-report"></div>
      <div class="flow-actions">
        <button id="flowPrimary" class="btn primary" type="button">开始升级</button>
      </div>
    </section>

    <section class="actions">
      <button id="primary" class="btn primary" type="button">安装 DSH</button>
      <div class="secondary">
        <button id="stopBtn" class="btn" type="button" hidden>停止</button>
        <button id="upgradeBtn" class="btn" type="button">升级</button>
        <button id="uninstallBtn" class="btn" type="button">卸载</button>
      </div>
    </section>

    <section class="console">
      <div class="console-head">
        <span data-i18n="console.title">控制台</span>
        <button id="clearBtn" class="clear" type="button" data-i18n="console.clear">清空</button>
      </div>
      <pre id="log" class="log mono" tabindex="0"></pre>
    </section>

    <footer class="foot">
      <span id="nodeInfo" class="mono">—</span>
      <span id="runtimeInfo" class="foot-note">检测中</span>
    </footer>
  </div>
  <script src="i18n.js"></script>
  <script src="app.js"></script>
</body>
</html>
