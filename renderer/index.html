<!doctype html>
<html lang="zh-CN" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self'; script-src 'self'; img-src 'self' data:; media-src 'self'">
  <title>DSH 就位</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body data-status="not-installed">
  <div id="boot" class="boot" role="status" aria-live="polite">
    <span class="boot-spinner" aria-hidden="true"></span>
    <p class="boot-text" data-i18n="notice.bootLoading">正在读取本地状态…</p>
  </div>
  <div id="modal" class="modal" hidden>
    <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <h2 id="modalTitle" class="modal-title"></h2>
      <div id="modalBody" class="modal-body"></div>
      <div class="modal-actions">
        <button id="modalCancel" class="btn" type="button"></button>
        <button id="modalConfirm" class="btn primary" type="button"></button>
      </div>
    </div>
  </div>
  <div id="about" class="about" hidden>
    <div class="about-card" role="dialog" aria-modal="true" aria-labelledby="aboutTitle">
      <button id="aboutClose" class="about-close" type="button" aria-label="关闭">
        <svg viewBox="0 0 12 12" aria-hidden="true"><path d="M1 1l10 10M11 1L1 11" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
      </button>
      <div class="about-head">
        <img class="about-icon" src="assets/app-icon.png" alt="" width="56" height="56">
        <div class="about-title">
          <h2 id="aboutTitle">DSH 就位</h2>
          <span id="aboutVersion" class="about-version mono">v—</span>
        </div>
      </div>

      <ul class="about-list">
        <li>
          <span class="about-ico" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 3.6-6 8-6s8 2 8 6"/></svg>
          </span>
          <button id="aboutMartin" class="about-link about-name" type="button" data-i18n-aria="about.martinAria" aria-label="打开 Martin 的 GitHub 主页">Martin</button>
        </li>
        <li>
          <span class="about-ico" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m4 7 8 6 8-6"/></svg>
          </span>
          <button id="aboutEmail" class="about-link as-button" type="button">hello@wordtk.com</button>
        </li>
        <li>
          <span class="about-ico" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2C6.48 2 2 6.58 2 12.26c0 4.5 2.87 8.32 6.84 9.67.5.1.68-.22.68-.49 0-.24-.01-.87-.01-1.7-2.78.62-3.37-1.37-3.37-1.37-.45-1.18-1.11-1.5-1.11-1.5-.91-.64.07-.62.07-.62 1 .07 1.53 1.06 1.53 1.06.89 1.56 2.34 1.11 2.91.85.09-.66.35-1.11.63-1.37-2.22-.26-4.56-1.14-4.56-5.07 0-1.12.39-2.03 1.03-2.75-.1-.26-.45-1.3.1-2.71 0 0 .84-.28 2.75 1.05a9.36 9.36 0 0 1 5 0c1.91-1.33 2.75-1.05 2.75-1.05.55 1.41.2 2.45.1 2.71.64.72 1.03 1.63 1.03 2.75 0 3.94-2.34 4.81-4.57 5.06.36.32.68.94.68 1.9 0 1.37-.01 2.47-.01 2.8 0 .27.18.6.69.49A10.02 10.02 0 0 0 22 12.26C22 6.58 17.52 2 12 2Z"/></svg>
          </span>
          <button id="aboutGithub" class="about-link as-button" type="button">github.com/onblog/dsh-ready</button>
        </li>
        <li>
          <span class="about-ico" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.5 2.6 3.8 5.6 3.8 9S14.5 18.4 12 21c-2.5-2.6-3.8-5.6-3.8-9S9.5 5.6 12 3Z"/></svg>
          </span>
          <button id="aboutSite" class="about-link as-button" type="button">dsh.wordtk.com</button>
        </li>
      </ul>

      <div class="about-update">
        <button id="updateBtn" class="btn" type="button" data-i18n="about.check">检测更新</button>
        <span id="updateStatus" class="update-status" role="status" aria-live="polite"></span>
      </div>

      <div class="about-support">
        <button id="aboutSponsor" class="about-sponsor" type="button">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true">
            <path d="M4 8h12v6a4 4 0 0 1-4 4H8a4 4 0 0 1-4-4V8Z" />
            <path d="M16 9h1.5a2.5 2.5 0 0 1 0 5H16" />
            <path d="M7 3.5c-.6.8-.6 1.7 0 2.5M11 3.5c-.6.8-.6 1.7 0 2.5" />
          </svg>
          <span data-i18n="about.sponsor">请我喝杯咖啡</span>
        </button>
      </div>

      <p class="about-license" data-i18n="about.license">AGPL-3.0-only · 商业授权需另行联系</p>
    </div>
  </div>
  <div class="app">
    <header class="bar">
      <div class="identity">
        <h1 data-i18n="app.title">DSH 就位</h1>
        <span class="name-en" data-i18n="app.subtitle">dsh-ready</span>
      </div>
      <div class="bar-actions">
        <button id="langBtn" class="theme-btn" type="button" data-i18n-aria="lang.aria" aria-label="切换语言">中文</button>
        <button id="themeBtn" class="theme-btn" type="button" data-i18n-aria="theme.aria" aria-label="切换主题">深色</button>
        <button id="aboutBtn" class="theme-btn" type="button" data-i18n-aria="about.aria" data-i18n="about.button" aria-label="关于 DSH 就位">关于</button>
        <button id="quitBtn" class="theme-btn" type="button" data-i18n-aria="quit.aria" data-i18n="quit" aria-label="退出 DSH 就位">退出</button>
      </div>
    </header>

    <section class="hero" aria-live="polite">
      <div id="petBox" class="whale" role="img" data-i18n-aria="pet.aria" aria-label="鲸鱼娘，点击互动">
        <img id="petImg" class="whale-img" src="assets/whale-girl.png" alt="">
        <video id="petA" class="pet-video" muted loop playsinline preload="auto"></video>
        <video id="petB" class="pet-video" muted loop playsinline preload="auto"></video>
        <span class="whale-halo"></span>
      </div>
      <div class="status-block">
        <div class="status-line">
          <span id="dot" class="dot"></span>
          <strong id="statusText">检查中</strong>
          <span id="versionTag" class="version-tag mono">v—</span>
        </div>
        <p id="hint" class="hint">正在读取本地状态…</p>
        <dl class="facts">
          <div class="fact">
            <dt data-i18n="fact.host">主机</dt>
            <dd id="addr" class="mono">—</dd>
          </div>
          <div class="fact">
            <dt data-i18n="fact.port">端口</dt>
            <dd class="port-cell">
              <button id="portValue" class="port-value mono" type="button" title="点击修改端口">3080</button>
              <input id="portInput" class="port-input mono" type="text" inputmode="numeric" hidden data-i18n-aria="port.aria" aria-label="DSH 端口">
            </dd>
          </div>
        </dl>
      </div>
    </section>

    <section id="flow" class="flow" hidden>
      <div class="flow-head">
        <span id="flowTitle">升级 DSH</span>
        <button id="flowBack" class="clear" type="button" data-i18n="flow.back">返回</button>
      </div>
      <p id="flowSummary" class="flow-summary">正在检查…</p>
      <p id="flowNote" class="flow-note" hidden></p>
      <section id="target" class="target">
        <div class="target-head">
          <label id="targetLabel" for="versionPicker">目标版本</label>
          <span id="latestTag" class="latest">最新 —</span>
        </div>
        <div class="combo">
          <button id="versionPicker" class="picker mono" type="button" aria-haspopup="listbox" aria-expanded="false">
            <span id="versionValue">加载中…</span>
            <svg class="chevron" viewBox="0 0 10 6" aria-hidden="true"><path d="M1 1l4 4 4-4" fill="none" stroke="currentColor" stroke-width="1.3"/></svg>
          </button>
          <ul id="versionList" class="version-list" role="listbox" hidden></ul>
        </div>
      </section>
      <div id="flowReport" class="flow-report"></div>
      <div class="flow-actions">
        <button id="flowPrimary" class="btn primary" type="button">开始升级</button>
      </div>
    </section>

    <section class="actions">
      <button id="primary" class="btn primary" type="button">安装 DSH</button>
      <div class="secondary">
        <button id="stopBtn" class="btn" type="button" hidden>停止</button>
        <button id="upgradeBtn" class="btn" type="button">升级</button>
        <button id="uninstallBtn" class="btn" type="button">卸载</button>
      </div>
    </section>

    <section class="console">
      <div class="console-head">
        <span data-i18n="console.title">控制台</span>
        <button id="clearBtn" class="clear" type="button" data-i18n="console.clear">清空</button>
      </div>
      <pre id="log" class="log mono" tabindex="0"></pre>
    </section>

    <footer class="foot">
      <span id="nodeInfo" class="mono">—</span>
      <span id="runtimeInfo" class="foot-note">检测中</span>
    </footer>
  </div>
  <script src="i18n.js"></script>
  <script src="app.js"></script>
</body>
</html>
